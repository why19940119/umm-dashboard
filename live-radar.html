<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live US Stock Radar</title><style>body{margin:0;background:#07111f;color:#edf4ff;font:15px system-ui}.w{max-width:1200px;margin:auto;padding:24px}.top,.filters{display:flex;justify-content:space-between;gap:12px;align-items:center}.ey{color:#60a5fa;font-size:12px;font-weight:700;letter-spacing:.1em}h1{margin:5px 0 0}.meta,.table{border:1px solid #29405f;border-radius:12px;background:#101d30}.meta{padding:16px;margin:22px 0;color:#9aabc2}.live{color:#34d399}.bad{color:#fb7185}.table{overflow:auto;margin-top:12px}table{border-collapse:collapse;width:100%;min-width:900px}th,td{text-align:left;padding:12px;border-bottom:1px solid #29405f}th{color:#9aabc2;font-size:12px}input,select{padding:9px;border:1px solid #29405f;border-radius:8px;background:#0b182b;color:#edf4ff}input{min-width:250px}@media(max-width:650px){.top,.filters{align-items:flex-start;flex-direction:column}input{min-width:0;width:100%}}</style><body><main class="w"><header class="top"><div><p class="ey">UMM INTELLIGENCE DASHBOARD</p><h1>Live US Stock Radar</h1></div><a href="index.html" style="color:#60a5fa">Mock dashboard</a></header><div id="meta" class="meta">Loading local radar snapshot…</div><div class="filters"><input id="q" placeholder="Search ticker or company"><select id="f"><option value="ALL">All types</option><option>LIQUIDITY</option><option>SPIKE</option></select></div><div class="table"><table><thead><tr><th>Rank</th><th>Type</th><th>Ticker</th><th>Company</th><th>Price</th><th>10m $Vol</th><th>Spike</th><th>10m Move</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>let all=[];const $=x=>document.querySelector(x),money=x=>'$'+Number(x||0).toLocaleString(),num=x=>x==null?'N/A':Number(x).toFixed(2);function draw(){let q=$('#q').value.toLowerCase(),f=$('#f').value;$('#rows').innerHTML=all.filter(x=>(f=='ALL'||x.selection_type==f)&&((x.symbol||'').toLowerCase().includes(q)||(x.name||'').toLowerCase().includes(q))).map((x,i)=>`<tr><td>${i+1}</td><td>${x.selection_type}</td><td><b>${x.symbol}</b></td><td>${x.name}</td><td>$${num(x.price)}</td><td>${money(x.current_10m_dollar_volume)}</td><td>${num(x.spike_ratio)}${x.spike_ratio==null?'':'x'}</td><td class="${x.current_10m_move_pct>=0?'live':'bad'}">${x.current_10m_move_pct>=0?'+':''}${num(x.current_10m_move_pct)}${x.current_10m_move_pct==null?'':'%'}</td></tr>`).join('')||'<tr><td colspan="8">No matching tickers</td></tr>'}$('#q').oninput=draw;$('#f').onchange=draw;fetch('radar_snapshot.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(x=>{all=x.tickers||[];$('#meta').innerHTML=`<b class="live">● Live local snapshot</b><br>Session: ${x.session||'N/A'} · Feed: ${x.feed||'N/A'}<br>Generated: ${x.generated_at_hkt||x.generated_at_et||'N/A'}<br>Tickers: ${all.length} · Failed API batches: ${x.failed_batches??'N/A'}`;draw()}).catch(()=>$('#meta').innerHTML='<b class="bad">Snapshot unavailable.</b> Run: <code>python3 publish_radar_snapshot.py</code> from the umm-dashboard folder, then refresh this page.')</script>
